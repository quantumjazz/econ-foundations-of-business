project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - "lectures/*/index.qmd"
  resources:
    - "lectures/*/img/**"
    - "lectures/*/data/**"

# Two mutually exclusive build profiles. The first one (public) is the
# default, so a plain `quarto render` never includes instructor-only content.
#   quarto render --profile public       -> _site/            (GitHub Pages)
#   quarto preview lectures/entrepreneurship/index.qmd --profile instructor
#                                        -> _site-instructor/ (what Victor presents from)
profile:
  group:
    - [public, instructor]

lang: bg

website:
  title: "Икономически основи на бизнеса"
  description: "Лекции по „Икономически основи на бизнеса“ · Нов български университет"
  page-navigation: false

filters:
  - theme/lecture.lua

format:
  html:
    theme: [cosmo, theme/site.scss]
    toc: false
  revealjs:
    # Same settings and theme as the Data Driven Business Decisions decks.
    theme: [default, theme/nbu.scss]
    template-partials:
      - theme/title-slide.html
    include-after-body: theme/deck.html
    slide-number: c/t
    hash: true
    center: false
    transition: fade
    transition-speed: fast
    width: 1280
    height: 720
    margin: 0.1
    scrollable: true
    progress: true
    fig-align: center
    code-overflow: wrap
    highlight-style: github
    link-external-newwindow: true
    footer: "Икономически основи на бизнеса | НБУ"
    logo: ""

execute:
  echo: false
