<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">Котка и наденица на тротоара</title>
  <desc id="desc">Котка седи на тротоара със затворени очи и вирнат нос. До нея лежи наденица, която тя не поглежда.</desc>
  <!-- Original illustration made for the course. Palette kept clear of the deck's role colours. -->

  <!-- pavement -->
  <rect x="0" y="424" width="600" height="96" fill="#EEF2F6"/>
  <path d="M0 424H600" stroke="#CBD5E1" stroke-width="4"/>
  <path d="M110 426V520M300 426V520M490 426V520M0 476H600" stroke="#DCE3EA" stroke-width="3"/>

  <!-- shadows -->
  <ellipse cx="386" cy="436" rx="118" ry="11" fill="#D6DEE7"/>
  <ellipse cx="176" cy="438" rx="80" ry="8" fill="#D6DEE7"/>

  <!-- sausage -->
  <g transform="rotate(-4 176 418)">
    <rect x="104" y="401" width="146" height="34" rx="17" fill="#9C4F3A"/>
    <path d="M124 409H228" stroke="#C27A62" stroke-width="5" stroke-linecap="round"/>
    <path d="M104 418l-13-9M104 418l-13 9M250 418l13-9M250 418l13 9" stroke="#6F3526" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- tail, curled along the pavement in front of the cat -->
  <path d="M452 414C506 418 512 452 470 456C430 460 380 452 330 447" fill="none" stroke="#4B4F58" stroke-width="20" stroke-linecap="round"/>
  <path d="M358 449C346 448 336 447 330 447" fill="none" stroke="#2F333A" stroke-width="20" stroke-linecap="round"/>

  <!-- body -->
  <path d="M312 432C300 372 306 312 348 286C392 262 444 284 458 338C470 386 466 420 452 432Z" fill="#4B4F58"/>
  <!-- haunch -->
  <ellipse cx="420" cy="398" rx="52" ry="38" fill="#3E424A"/>
  <!-- chest -->
  <path d="M326 432C318 384 324 332 352 306C372 330 376 392 368 432Z" fill="#E7E5E4"/>
  <!-- front legs and paws -->
  <path d="M338 372V424M362 374V424" stroke="#4B4F58" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="336" cy="429" rx="16" ry="8" fill="#E7E5E4"/>
  <ellipse cx="364" cy="429" rx="16" ry="8" fill="#E7E5E4"/>

  <!-- head: tilted up and away from the sausage, eyes shut -->
  <g transform="rotate(-14 372 228)">
    <path d="M324 196L318 130L366 172Z" fill="#4B4F58"/>
    <path d="M330 184L327 146L354 170Z" fill="#E8B4A6"/>
    <path d="M396 170L436 128L436 196Z" fill="#4B4F58"/>
    <path d="M405 172L428 146L429 184Z" fill="#E8B4A6"/>
    <ellipse cx="376" cy="226" rx="66" ry="56" fill="#4B4F58"/>
    <ellipse cx="392" cy="252" rx="34" ry="22" fill="#E7E5E4"/>
    <path d="M346 222q11 9 22 0M394 222q11 9 22 0" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M384 242h14l-7 8z" fill="#D9777A"/>
    <path d="M391 250q-5 8-12 5M391 250q5 8 12 5" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
    <path d="M414 246l46-8M416 254l46 4M346 246l-44-8M344 254l-44 4" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
