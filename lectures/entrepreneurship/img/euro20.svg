<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title">
  <title id="title">Стилизирана банкнота от 20 евро</title>
  <!-- Original stylised icon, not a reproduction of a banknote. -->
  <g transform="rotate(-7 160 100)">
    <rect x="22" y="36" width="276" height="136" rx="14" fill="#DBEAFE" stroke="#0F172A" stroke-width="4"/>
    <rect x="40" y="54" width="240" height="100" rx="8" fill="none" stroke="#93C5FD" stroke-width="3"/>
    <circle cx="206" cy="104" r="34" fill="none" stroke="#93C5FD" stroke-width="3"/>
    <text x="58" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#0F172A">20</text>
    <text x="189" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#0F172A">€</text>
  </g>
</svg>
